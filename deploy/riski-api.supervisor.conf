# RISKI API — supervisor unit (deployment-config)
#
# This is the currently deployed unit (moved from the repo root, values
# unchanged) plus supervisor hygiene. Host location per API.md:
# /etc/supervisor/conf.d/riski-api.conf — verify the paths against the
# actual host before copying.
#
# Apply: cp deploy/riski-api.supervisor.conf /etc/supervisor/conf.d/riski-api.conf
#        sudo supervisorctl reread && sudo supervisorctl update
#
# Restart (the ONLY supported restart path — never pkill the process,
# that bypasses supervisor's state tracking):
#        sudo supervisorctl restart riski-api
#
# Rationale:
# - 127.0.0.1 bind: the security perimeter is the apache2 proxy; uvicorn is
#   never exposed directly.
# - Single worker: the API's session store is in-memory (documented
#   constraint, see deploy/README.md and API.md).
# - stopasgroup/killasgroup: uvicorn spawns a process group; without these,
#   restarts leak worker processes.
# - Log rotation via supervisor (maxbytes/backups) so apiServer logs cannot
#   fill the disk on a long-lived host.
# - RISKI_* environment block: tuning knobs documented in API.md
#   (api-capacity-hardening / api-security-hardening). Only set what you
#   deviate from; defaults preserve the tested behaviour.

[program:riski-api]
command=/usr/bin/python3 -m uvicorn src.apiServer:app --host 127.0.0.1 --port 11384
directory=<REPO_DIR>
user=<USER>
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stderr_logfile=<REPO_DIR>/riski-api.err.log
stdout_logfile=<REPO_DIR>/riski-api.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED=1
# RISKI_* overrides, e.g.:
# environment=PYTHONUNBUFFERED=1,RISKI_RATE_LIMIT_LLM=20,RISKI_PHASE_TIMEOUT=10800
