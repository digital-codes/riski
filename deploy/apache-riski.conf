# RISKI apache2 vhost — TEMPLATE (deployment-config)
#
# Host location (per API.md): /etc/apache2/sites-available/riski.conf
#
# IMPORTANT: this is a template of the *decisions*, not a copy of the
# deployed vhost — the deployed machine's actual vhost (server name,
# TLS, frontend serving) was not part of this repository when this was
# written. Merge the rationale blocks below into the real vhost on the
# deployment host; do NOT copy this file blindly.
#
# Apply: review placeholders (<SERVER_NAME>, <REPO_DIR>) against the host,
#        sudo apachectl configtest && sudo systemctl reload apache2
# Modules: sudo a2enmod proxy proxy_http headers
#
# Rationale (per the 2026-10-25 analyses):
# - ProxyTimeout 300: apache's default 60 s Timeout silently converts the
#   90 s LLM summary calls into 502s while uvicorn keeps working. 300 s is
#   above the longest legitimate request (LLM timeout + retries).
# - ProxyPreserveHost + forwarded headers: the app's trusted-proxy logic
#   (RISKI_TRUSTED_PROXIES, default 127.0.0.1) relies on the proxy setting
#   X-Forwarded-*; without them the rate limiter would key every client as
#   127.0.0.1.
# - retry=0: a briefly busy backend (pool saturation 503s) must not mark
#   the worker as down.
# - Security headers (HSTS, nosniff, referrer policy, frame policy): the
#   outer layer; the app-level rate limiter (api-security-hardening) is
#   the precise inner control. TLS termination stays host-specific — add
#   it here per the existing vhost/certbot setup.
# - Same-origin frontend (if served from this vhost) needs no CORS; split
#   deployments set RISKI_CORS_ORIGINS instead.

<VirtualHost *:80>
    ServerName <SERVER_NAME>

    # --- security headers (outer layer) -----------------------------------
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # enable together with TLS:
    # Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    # Header always set Content-Security-Policy "frame-ancestors 'self'"

    # --- API proxy (per API.md: /api/ -> loopback:11384) --------------------
    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass        /api/ http://127.0.0.1:11384/ retry=0
    ProxyPassReverse /api/ http://127.0.0.1:11384/

    # forwarded headers: the app trusts these ONLY from 127.0.0.1
    # (RISKI_TRUSTED_PROXIES) — keep them set here
    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog ${APACHE_LOG_DIR}/riski-error.log
    CustomLog ${APACHE_LOG_DIR}/riski-access.log combined
</VirtualHost>
