file_tags:
  Building Construction:
    description: 'Hochbau und bauliche Anlagen: Neubau, Sanierung, Erweiterung und
      Rückbau von Gebäuden und kommunalen Einrichtungen. Achtung: ''Sanierung'' heißt
      im Deutschen reconstruction, nicht maintenance.'
    qualifier_hint: Neubau | Sanierung (reconstruction) | Erweiterung | Rückbau
  Childcare:
    description: 'Kindertagesbetreuung: Kita-Plätze, Kita-Bau und -sanierung sowie
      Betreuungsqualität.'
    qualifier_hint: null
  Climate:
    description: 'Klimaschutz und Klimaanpassung: CO2-Minderung, Klimawandelfolgen,
      Hitzevorsorge, kommunale Klimakonzepte.'
    qualifier_hint: null
  Culture:
    description: 'Kultur und Kulturveranstaltungen: Museen, Theater, Denkmalschutz
      und -pflege, Kulturförderung (zugehörige Bauvorhaben auch unter Building Construction).'
    qualifier_hint: null
  Economy:
    description: Wirtschaftsförderung, lokale Unternehmen, Handel, Gewerbe, Handwerk,
      Tourismus und Standortentwicklung.
    qualifier_hint: null
  Education:
    description: 'Allgemeine Bildungs- und Schulthemen: Schulen, Schulbau oder -sanierung,
      schulische Angebote, Erwachsenenbildung (ohne Kita - siehe Childcare).'
    qualifier_hint: null
  Elections:
    description: 'Wahlen: Kommunal-, Bundestags- oder Landtagswahlen, Wahlorgane und
      Wahlgänge, Wahllokale und Wahlrecht.'
    qualifier_hint: null
  Energy:
    description: 'Energie: Wärme- und Stromversorgung, Fernwärme, erneuerbare Energien
      (Solar- und Windkraft), Effizienzkonzepte und kommunale Energiekonzepte.'
    qualifier_hint: null
  Funding:
    description: 'Förderung und Zuwendungen: Förderprogramme, Mittel von Bund, Land,
      EU oder privaten Drittmittelgebern, Zuschüsse.'
    qualifier_hint: null
  Health:
    description: 'Gesundheit: Krankenhäuser, ärztliche Versorgung, Sucht- und Drogenhilfe,
      psychische Gesundheit, Gesundheitsschutz und Hygiene.'
    qualifier_hint: null
  Housing:
    description: 'Wohnen: Wohnungsbau, Wohnungswirtschaft, Mietspiegel- und Mietthemen,
      Wohnungslosenhilfe.'
    qualifier_hint: null
  Mobility:
    description: 'Verkehr und Mobilität: ÖPNV, Straßenbahn, Buslinien, Fahrradverkehr,
      Fußverkehr, Verkehrsberuhigung, Verkehrsmanagement und neue Mobilitätsangebote.'
    qualifier_hint: null
  Politics:
    description: 'Politische Verfahren des Gemeinderats: Anträge, Wahlen von Beigeordneten,
      Sitzungen, Gremien- und Organisationsfragen, Beschlussverfahren.'
    qualifier_hint: null
  Population:
    description: 'Bevölkerung und Einwohnerentwicklung: Zuzug, Demografie und Einwohnerstatistik
      der Stadtgesellschaft.'
    qualifier_hint: null
  Road construction:
    description: 'Straßenbau und Straßenraum: Neubau, Sanierung, Erweiterung, Rückbau
      und Instandsetzung von Straßen, Plätzen, Wegen und Radwegen.'
    qualifier_hint: Neubau | Sanierung (reconstruction) | Erweiterung | Ausbau | Rückbau
  Science:
    description: 'Wissenschaft und Forschung: Hochschulen, Forschungseinrichtungen,
      Studienplätze und Technologietransfer.'
    qualifier_hint: null
  Seniors:
    description: 'Senioren: Altenhilfe, Pflege, Seniorenangebote, Seniorenvertretung
      und Angebote für Ältere.'
    qualifier_hint: null
  Social:
    description: 'Soziales: Sozialarbeit, Sozialleistungen, Wohnungslosenhilfe, Migrations-
      und Fluchtservices, Jugendhilfe (ohne Kita - eigener Tag Childcare).'
    qualifier_hint: null
  Sport:
    description: 'Sport: Sportstätten, Sportangebote, Vereins- und Breitensportförderung
      (Bauvorhaben zusätzlich Building Construction).'
    qualifier_hint: null
  Volunteering:
    description: 'Ehrenamt: Vereine, bürgerschaftliches Engagement, Projektförderung
      aus Bürgerinitiativen.'
    qualifier_hint: null
  Work/Labour:
    description: 'Arbeit: Arbeitsförderung, Jobcenter, Stellen der Stadtverwaltung,
      Aus- und Weiterbildung, Arbeitsrecht.'
    qualifier_hint: null
  city development:
    description: 'Stadtentwicklung: Bebauungspläne, Planverfahren, Quartiersentwicklung,
      Städtebauförderung und Stadtteilmanagement.'
    qualifier_hint: null
  smart city:
    description: 'Smart City: Digitale Infrastruktur, Digitalisierungsprojekte, Datenplattformen
      und digitale Teilhabe (daneben oft Politics).'
    qualifier_hint: null
meeting_scope:
  meeting_name_patterns:
  - (?i)^gemeinderat\b
  organization: Gemeinderat
outcome_anchors:
  abgelehnt:
  - Der Antrag wurde mehrheitlich abgelehnt.
  - Dem Antrag wurde vom Gemeinderat nicht zugestimmt.
  kenntnisnahme:
  - Die Anfrage wurde zur Kenntnis genommen, keine Beschlussfassung.
  vertagt:
  - Die Behandlung des Antrags wurde auf eine spätere Sitzung vertagt.
  - Das Thema wurde zurückgestellt, da noch Sach stand fehlt.
  zugestimmt:
  - Der Antrag wurde einstimmig zugestimmt und zur Umsetzung verwiesen.
  - Der Gemeinderat hat der Vorlage einstimmig zugestimmt.
